<script>
(()=>{
'use strict';
/* ================= CONFIG (tune in testing) ================= */
const CONFIG={
  wrongTotal:5, wrongInRow:3, streakToLevelUp:5, retryMin:3, retryMax:5, speakChance:.35, speakOfflineAfter:7,
  baseSpeed:240, speedPerStreak:15, goalPerChild:30, qSeconds:60, recSeconds:10, bookGap:[2,3]
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n), pick=a=>a[ri(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALPHA='abcdefghijklmnopqrstuvwxyz'.split(''), VOW='aeiou'.split(''), CONS=ALPHA.filter(c=>!VOW.includes(c));

const uid=()=>{const c='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[ri(c.length)];return s};
/* ================= Net: BroadcastChannel (same device) + WebSocket relay (separate devices) =================
   Messages are small JSON {t,from,to,code,...}. Only messages with the same class code are accepted. */
const Net={code:'',id:uid(),ch:null,ws:null,seen:new Set(),h:{},
  init(){try{this.ch=new BroadcastChannel('khel-v2');this.ch.onmessage=e=>this._in(e.data)}catch(e){}
    this.connect();
    addEventListener('storage',e=>{if(e.key==='khel-msg'&&e.newValue){try{this._in(JSON.parse(e.newValue))}catch(_){}}})},
  connect(){if(!window.KHEL_RELAY)return;const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/relay';
    const open=()=>{try{const w=new WebSocket(url);this.ws=w;w.onmessage=e=>{try{this._in(JSON.parse(e.data))}catch(_){}};w.onclose=()=>{this.ws=null;setTimeout(open,1500)};w.onerror=()=>{try{w.close()}catch(_){}}}catch(e){setTimeout(open,3000)}};open()},
  send(m){m.mid=Math.random().toString(36).slice(2);m.from=this.id;m.code=this.code;this.seen.add(m.mid);
    try{this.ch&&this.ch.postMessage(m)}catch(e){}
    try{this.ws&&this.ws.readyState===1&&this.ws.send(JSON.stringify(m))}catch(e){}
    this._p2p(m);
    try{localStorage.setItem('khel-msg',JSON.stringify(m));localStorage.removeItem('khel-msg')}catch(e){}},
  /* serverless link between devices: WebRTC (PeerJS) - the teacher page is the hub, children connect with the class code.
     Only the handshake touches the free PeerJS cloud; messages and voice recordings go straight device to device. */
  isTeacher:!!document.getElementById('t-code'),pc:{},pcode:'',peer:null,conn:null,conns:{},
  _p2pStart(){const code=this.code;if(!window.Peer)return;
    if(this.peer){try{this.peer.destroy()}catch(e){}this.peer=null;this.conn=null;this.conns={}}
    this.pcode=code;if(!code)return;const opt=window.KHEL_PEER||{};const pid='khelv1-'+code;
    const hook=c=>{c.on('data',d=>{try{this._in(typeof d==='string'?JSON.parse(d):d)}catch(e){}});};
    try{
      if(this.isTeacher){const p=new Peer(pid,opt);this.peer=p;
        p.on('connection',c=>{hook(c);c.on('open',()=>{const sid=c.metadata&&c.metadata.sid;if(sid)this.conns[sid]=c});c.on('close',()=>{for(const k in this.conns)if(this.conns[k]===c)delete this.conns[k]})});
        p.on('error',e=>{if(e&&e.type==='unavailable-id'){this.pcode='';setTimeout(()=>{this.pcode=''},0)}});}
      else{const p=new Peer(opt);this.peer=p;
        const dial=()=>{if(this.peer!==p||p.destroyed)return;const c=p.connect(pid,{metadata:{sid:this.id},reliable:true});hook(c);
          c.on('open',()=>{this.conn=c});const lost=()=>{if(this.conn===c)this.conn=null;setTimeout(dial,2500)};c.on('close',lost);c.on('error',lost);
          setTimeout(()=>{if(!c.open){try{c.close()}catch(e){}if(this.conn!==c&&this.peer===p&&!p.destroyed){/* retry handled by close */}}},8000)};
        p.on('open',dial);p.on('error',e=>{if(e&&e.type==='peer-unavailable')setTimeout(dial,2500)});
        p.on('disconnected',()=>{try{p.reconnect()}catch(e){}})}
    }catch(e){}},
  _p2p(m){try{const s=JSON.stringify(m);
    if(this.isTeacher){if(m.to){const c=this.conns[m.to];c&&c.open&&c.send(s)}else for(const k in this.conns){const c=this.conns[k];c.open&&c.send(s)}}
    else if(this.conn&&this.conn.open)this.conn.send(s)}catch(e){}},
  on(t,f){this.h[t]=f},
  _in(m){if(!m||!m.mid||this.seen.has(m.mid))return;this.seen.add(m.mid);if(m.from===this.id||!this.code||m.code!==this.code)return;if(m.to&&m.to!==this.id)return;const f=this.h[m.t];f&&f(m)}};
Net.init();setInterval(()=>{if(Net.pcode!==Net.code)Net._p2pStart()},800);

/* ================= Audio ================= */
const Snd={ctx:null,muted:false,
  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},

/* ================= Run logic ================= */
/* Item pool: which letters were already asked in each difficulty, plus the spaced-retry queue for missed letters */
const Pool={covered:{1:new Set(),2:new Set()},retry:[],recent:[],kinds:[]};
const aheadCount=()=>R?R.objs.filter(o=>o.q&&o.state==='ahead').length:0;
const AUTO_DIST=150;   // a book opens its question by itself this close, so no question is skipped
function resetPoolAttempt(){Pool.retry=[];Pool.recent=[];Pool.kinds=[]}
function nextQuestion(){
  const d=S.diff;let L,kind;
  const due=Pool.retry.findIndex(r=>r.wait<=0);
  if(due>=0){const r=Pool.retry.splice(due,1)[0];L=r.letter;kind=r.kind}
  else{
    const pend=new Set(Pool.retry.map(r=>r.letter));
    let c=ALPHA.filter(x=>!Pool.covered[d].has(x)&&!pend.has(x)&&!Pool.recent.includes(x));   // letters not covered yet come first
    if(!c.length)c=ALPHA.filter(x=>!pend.has(x)&&!Pool.recent.includes(x));                    // everything covered: letters repeat
    if(!c.length)c=ALPHA.slice();
    L=pick(c);
    const k=Pool.kinds,twoB=k.length>=2&&k[k.length-1]==='B'&&k[k.length-2]==='B';
    kind=(!twoB&&Math.random()<CONFIG.speakChance)?'B':'A';
    Pool.retry.forEach(r=>r.wait--);                                                            // one more "other item" has been asked
  }
  Pool.covered[d].add(L);Pool.recent.push(L);if(Pool.recent.length>3)Pool.recent.shift();Pool.kinds.push(kind);
  return makeQ(d,L,kind);
}
function queueRetry(q){
  if(Pool.retry.some(r=>r.letter===q.letter))return;
  const n=CONFIG.retryMin+ri(CONFIG.retryMax-CONFIG.retryMin+1);               // 3 to 5 other items first
  Pool.retry.push({letter:q.letter,kind:q.kind,wait:Math.max(0,n-aheadCount())}); // questions already on the road count as "other items"
}


/* the teacher chases the child: 1 mistake = closer, 3 in a row or 5 in total = caught */
const chase=()=>R?Math.min(1,Math.max(R.wrongRow/CONFIG.wrongInRow,R.wrong/CONFIG.wrongTotal)):0;
const GAP0=215,GAP1=44;

function newRun(){
  const th=THEMES[S.diff-1];buildBG(th);resetPoolAttempt();
  R={th,state:'run',wrongRow:0,streak:0,objs:[],decos:[],spawnX:W+260,v:0,plain:1,card:null,
     correct:0,wrong:0,pendingLU:0,speak:null,prev:'run',decoT:0,failing:false,caught:false,qt:0,tx:-170,tph:0};
  Object.assign(P,{lift:0,vy:0,crawlT:0,held:false,jumpBuf:0,stumble:0,crawling:false});
  refreshHUD();sendStatus();
}
/* only books carry questions; hurdles and bars are plain obstacles */
function spawnNext(){
  const x=R.spawnX;let k;
  if(R.plain<=0){k='book';R.plain=CONFIG.bookGap[0]+ri(CONFIG.bookGap[1]-CONFIG.bookGap[0]+1)}
  else{R.plain--;k=Math.random()<.5?'hurdle':'bar'}
  const w=k==='book'?84:k==='hurdle'?72:112;
  const o={k,x,w,hit:false,cleared:false,armed:false,state:'ahead'};
  if(k==='book')o.q=nextQuestion();
  R.objs.push(o);
  const coinRow=(cx,n,y)=>{for(let i=0;i<n;i++)R.objs.push({k:'coin',x:cx+i*46,y,taken:false})};
  if(k==='bar')coinRow(x+8,3,28);else{coinRow(x-6,1,125);coinRow(x+24,1,150);coinRow(x+54,1,125)}
  R.spawnX=x+w+rnd(360,460)+(k==='book'?80:0);
}
function updateTeacher(dt){
  const c=chase(),gap=c>=1?GAP1:GAP0-c*(GAP0-GAP1-6);
  R.tx+=((P.x-gap)-R.tx)*Math.min(1,dt*(c>=1?6:2.2));R.tph+=dt*(R.state==='failing'?.3:1);
  if(R.state==='failing'&&!R.caught&&P.x-R.tx<=GAP1+24){R.caught=true;P.stumble=2;shake=.5;Snd.thud();floatText(P.x+20,GY-160,'CAUGHT!','#ff4d4d',46);setTimeout(()=>{if(R&&R.state==='failing')gameOver()},1500)}
}
function qShow(on){$('#qtimer').classList.toggle('on',on);if(on){$('#qtimer i').style.transform='scaleX(1)';$('#qtimer').classList.remove('low')}}

function updateRun(dt){
  P.t+=dt;
  if(!R)return;
  const live=R.state==='run';
  if(live||R.state==='failing'){
    let tgt=CONFIG.baseSpeed+Math.min(R.streak,5)*CONFIG.speedPerStreak;
    if(R.state==='failing')tgt=0;
    else{const b=R.objs.find(o=>o.k==='book'&&o.state==='ahead'&&o.x>P.x-20);                 // ease off as a question book gets close
      if(b)tgt*=.5+.5*clamp((b.x-P.x-AUTO_DIST)/400,0,1)}
    R.v+=((P.stumble>0?tgt*.45:tgt)-R.v)*Math.min(1,dt*(R.state==='failing'?3:4));
    const dx=R.v*dt;scroll+=dx;
    for(const o of R.objs)o.x-=dx;for(const d of R.decos)d.x-=dx;R.spawnX-=dx;
    R.objs=R.objs.filter(o=>o.x>-320);R.decos=R.decos.filter(d=>d.x>-100);
    if(live){while(R.spawnX<W+80)spawnNext()}
    R.decoT-=dx;if(R.decoT<=0){R.decoT=rnd(260,520);R.decos.push({k:pick(['lamp','bench','tree','tree']),x:W+60})}
    P.crawlT=Math.max(0,P.crawlT-dt);P.jumpBuf=Math.max(0,P.jumpBuf-dt);P.stumble=Math.max(0,P.stumble-dt);
    if(P.lift>0){P.vy-=2700*dt;P.lift+=P.vy*dt;if(P.lift<=0){P.lift=0;P.vy=0;if(P.jumpBuf>0&&live){P.vy=840;P.lift=1;P.jumpBuf=0;Snd.jump()}}}
    P.crawling=P.lift<=1&&(P.held||P.crawlT>0);
    const tr=S.eq.trail;if(live&&tr!=='none'&&Math.random()<dt*40){const cols=tr==='rain'?['#e5383b','#ff9f1c','#ffd23f','#3fae5b','#2b6fdb']:['#ffd23f','#fff3b0','#ffffff'];
      parts.push({x:P.x-16,y:GY-P.lift-(P.crawling?20:40)+rnd(-18,18),vx:-R.v*.6,vy:rnd(-30,30),life:.6,max:1,col:pick(cols),size:rnd(5,9),kind:tr==='stars'?'star':'dot',rot:0,g:0})}
    if(live){
      const h=P.crawling?46:100,top=GY-P.lift-h,bot=GY-P.lift;
      for(const o of R.objs){
        if(o.k==='coin'){if(!o.taken){const cy=GY-o.y;if(Math.abs(o.x-P.x)<28&&cy>top-12&&cy<bot+12){o.taken=true;S.coins++;Snd.coin();burst(o.x,cy,5,['#ffc83d','#fff3b0'],160,'coin');refreshHUD()}}continue}
        const d=o.x-P.x,low=o.k!=='bar';
        if(o.armed&&d<=(low?44:70)){o.armed=false;if(low){P.vy=840;P.lift=Math.max(P.lift,1);Snd.jump()}else P.crawlT=1.15}   // a correct answer clears the book by itself
        if(o.q&&o.state==='ahead'&&d<=AUTO_DIST&&d>-o.w){openCard(o);break}
        if(!o.hit&&!o.cleared){
          const hx=P.x+16>o.x&&P.x-16<o.x+o.w;
          const oy1=o.k==='book'?GY-62:o.k==='hurdle'?GY-52:GY-136,oy2=low?GY:GY-70;
          if(hx&&bot>oy1&&top<oy2){o.hit=true;P.stumble=.7;shake=.25;Snd.thud();burst(P.x+10,GY-50,8,['#fff','#ffe28a'],200)}}
      }
      if(R.pendingLU>0){R.pendingLU-=dt;if(R.pendingLU<=0)doLevelUp()}
    }
  }else if(R.state==='ask'||R.state==='result'||R.state==='speakwait'){scroll+=26*dt}   // the world creeps along in slow motion behind a question
  if(R.state==='run'||R.state==='failing'||R.state==='cd'||R.state==='celebrate')updateTeacher(dt);
  /* one minute per question */
  if(R.state==='ask'||(R.state==='speakwait'&&R.speak&&!R.speak.sent)){R.qt+=dt;const left=CONFIG.qSeconds-R.qt;
    $('#qtimer i').style.transform='scaleX('+clamp(left/CONFIG.qSeconds,0,1)+')';$('#qtimer').classList.toggle('low',left<10);if(left<=0)timeUp()}
  if(R.state==='speakwait'&&R.speak&&R.speak.sent){const s=R.speak;s.t+=dt;s.rs=(s.rs||0)+dt;
    if(s.rs>3){s.rs=0;submitSpeak()}
    if(s.t>CONFIG.speakOfflineAfter&&!isLinked()&&$('#sp-self').style.display!=='block'){$('#sp-st').textContent='No teacher linked';$('#sp-self').style.display='block'}}
  if(endsAt&&!ended){const left=endsAt-Date.now();$('#h-timer').style.display='flex';$('#h-tt').textContent=`${Math.max(0,Math.floor(left/60000))}:${String(Math.max(0,Math.floor(left/1000)%60)).padStart(2,'0')}`;if(left<=0)endSession()}
}
function timeUp(){
  if(R.state==='ask')answerCard({correct:false},null);
  else if(R.state==='speakwait'&&R.speak&&!R.speak.sent)finishSpeak(false,false)}

/* ----- right / wrong feedback: big tick or cross, colour flash, repeated sound ----- */
function verdictFx(ok){const f=$('#fb');f.className=ok?'ok':'bad';void f.offsetWidth;f.classList.add('on');
  if(ok)Snd.right();else Snd.bad();try{navigator.vibrate&&navigator.vibrate(ok?[70]:[130,70,130])}catch(e){}
  clearTimeout(verdictFx.t);verdictFx.t=setTimeout(()=>f.classList.remove('on'),1300)}

/* ----- answers ----- */
function noteLetter(q){if(q.letter)S.letters.add(q.letter)}
function onCorrect(q){
  R.streak++;R.wrongRow=0;R.correct++;S.stats.correct++;S.stats.best=Math.max(S.stats.best,R.streak);noteLetter(q);
  const cb=R.streak>=4?3:R.streak>=2?2:1;R.gain=5*cb;S.coins+=R.gain;
  refreshHUD();sendStatus();
  if(R.streak>=CONFIG.streakToLevelUp&&!R.pendingLU)R.pendingLU=.55;       // 5 in a row completes the difficulty
}
function onWrong(q){
  R.streak=0;R.wrong++;R.wrongRow++;S.stats.wrong++;shake=.3;
  queueRetry(q);                                                           // asked again after 3-5 other items
  setTimeout(()=>Say.say(SAYW[q.letter]),900);                              // after a miss, the child hears the right letter once
  refreshHUD();sendStatus();
  if(R.wrong>=CONFIG.wrongTotal||R.wrongRow>=CONFIG.wrongInRow){R.failing=true;R.pendingLU=0}   // the teacher catches the child
}
function afterQuestion(ok,o){
  if(!R)return;
  if(R.state==='result'){if(ok){o.cleared=true;o.armed=true;if(R.gain){floatText(P.x+50,GY-150,'+'+R.gain,'#ffd23f',40);burst(P.x+40,GY-110,16,['#ffc83d','#ff6f91','#3fae5b','#2b6fdb','#fff'],300,'star')}}
    R.state=R.failing?'failing':'run'}
  R.card=null}
/* ----- hear-and-choose card (full screen) ----- */
function openCard(o){
  R.state='ask';R.card={o,locked:false};R.qt=0;P.held=false;P.crawlT=0;
  const q=o.q;if(q.kind==='B'){startSpeak(o);return}
  const box=$('#qc-opts');box.innerHTML='';
  q.options.forEach((op,i)=>{const bt=document.createElement('button');bt.className='qopt';bt.dataset.k=op.key;bt.textContent=op.label;bt.onclick=()=>answerCard(op,bt);box.appendChild(bt)});
  qShow(true);$('#qcard').classList.add('on');Snd.pop();speakQ(q);
}
function answerCard(op,btn){
  const c=R&&R.card;if(!c||c.locked||R.state!=='ask')return;c.locked=true;const o=c.o,q=o.q;
  $$('#qc-opts .qopt').forEach(x=>{if(x.dataset.k===q.letter)x.classList.add('good')});if(btn&&!op.correct)btn.classList.add('bad');
  R.state='result';o.state=op.correct?'cleared':'failed';
  verdictFx(op.correct);if(op.correct)onCorrect(q);else onWrong(q);
  setTimeout(()=>{$('#qcard').classList.remove('on');qShow(false);afterQuestion(op.correct,o)},1500);
}
/* ----- recording the child's voice: starts by itself, stops after 10 s, then Again / Done ----- */
const Rec={stream:null,mr:null,chunks:[],ok:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder&&window.isSecureContext),state:'idle',timer:null,last:null,
  async prime(){if(!this.ok||this.stream)return;try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){this.ok=false}},
  async start(){
    if(!R||!R.speak)return;const sid=R.speak.id;
    if(!this.ok){recUI();return}
    this.state='starting';this.last=null;recUI();
    try{if(!this.stream)this.stream=await navigator.mediaDevices.getUserMedia({audio:true})}
    catch(e){this.ok=false;this.state='idle';recUI();return}
    if(!R||!R.speak||R.speak.id!==sid)return;
    const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>window.MediaRecorder.isTypeSupported(t))||'';
    this.chunks=[];let mr;try{mr=new MediaRecorder(this.stream,mt?{mimeType:mt}:{})}catch(e){this.ok=false;this.state='idle';recUI();return}
    mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};
    mr.onstop=()=>{if(this.mr===mr)this.finish(mr.mimeType||mt||'audio/webm',sid)};
    mr.start();this.mr=mr;this.state='rec';clearTimeout(this.timer);this.timer=setTimeout(()=>this.stop(),CONFIG.recSeconds*1000);recUI();Snd.pop()},
  stop(){clearTimeout(this.timer);if(this.mr&&this.mr.state!=='inactive')this.mr.stop()},
  finish(mime,sid){const blob=new Blob(this.chunks,{type:mime});const fr=new FileReader();
    fr.onload=()=>{if(!R||!R.speak||R.speak.id!==sid)return;this.last={aid:Math.random().toString(36).slice(2,8),qid:sid,mime,data:fr.result};this.state='ready';recUI()};fr.readAsDataURL(blob)},
  abort(){clearTimeout(this.timer);const m=this.mr;this.mr=null;try{if(m&&m.state!=='inactive')m.stop()}catch(e){}this.state='idle';this.last=null},
  release(){this.abort();if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}}};
function sendAudio(){const a=Rec.last;if(a)Net.send({t:'audio',qid:a.qid,aid:a.aid,mime:a.mime,data:a.data})}
function submitSpeak(){const sp=R&&R.speak;if(!sp)return;Net.send({t:'ask',qid:sp.id,text:sp.g.q.display,diff:S.diff,rec:Rec.ok&&!!Rec.last});sendAudio()}
function recUI(){
  const sp=R&&R.speak;if(!sp)return;const st=Rec.state,show=(id,on)=>{$(id).style.display=on?'flex':'none'};
  if(sp.sent){show('#sp-ind',0);show('#sp-stop',0);show('#sp-again',0);show('#sp-submit',0);$('#sp-st').textContent='⏳';return}
  const recording=st==='rec'||st==='starting';
  show('#sp-ind',recording);show('#sp-stop',st==='rec');
  show('#sp-again',Rec.ok&&st==='ready');show('#sp-submit',st==='ready'||!Rec.ok);
  $('#sp-st').textContent=!Rec.ok?'🔇':st==='starting'?'🎤…':'';
  if(st==='rec'&&!sp.bar){sp.bar=true;const b=$('#sp-bar i');b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width '+CONFIG.recSeconds+'s linear';b.style.width='0%'}
  if(st!=='rec')sp.bar=false}
$('#sp-stop').onclick=()=>{Snd.init();Rec.stop()};
$('#sp-again').onclick=()=>{Snd.init();if(R&&R.speak&&!R.speak.sent){R.speak.bar=false;Rec.start()}};
$('#sp-submit').onclick=()=>{Snd.init();const sp=R&&R.speak;if(!sp||sp.sent)return;sp.sent=true;sp.t=0;sp.rs=0;qShow(false);submitSpeak();recUI()};
/* ----- say-it question: the teacher judges ----- */
function startSpeak(g){
  g.state='waiting';R.state='speakwait';const id=Math.random().toString(36).slice(2,8);
  R.speak={g,id,t:0,rs:0,sent:false,bar:false};
  $('#sp-word').textContent=g.q.display;$('#sp-self').style.display='none';$('#sp-st').textContent='';
  ['#sp-ind','#sp-stop','#sp-again','#sp-submit'].forEach(s=>$(s).style.display='none');
  qShow(true);$('#speak').classList.add('on');Rec.abort();recUI();Rec.start();
}
function finishSpeak(ok,practice){
  if(!R||!R.speak)return;                                   // works even if the tab lost focus meanwhile
  const g=R.speak.g;R.speak=null;R.card=null;Rec.abort();R.state='result';qShow(false);
  g.state=ok?'cleared':'failed';verdictFx(ok);
  if(ok){if(!practice)S.stats.stars++;onCorrect(g.q)}else{S.stats.speakNo++;onWrong(g.q)}
  setTimeout(()=>{$('#speak').classList.remove('on');afterQuestion(ok,g)},1400);
}
$('#sp-ok').onclick=()=>finishSpeak(true,true);
Net.on('verdict',m=>{if(R&&R.speak&&m.qid===R.speak.id)finishSpeak(!!m.ok,false)});
Net.on('link',m=>{const was=isLinked();linked=true;teacherSeen=Date.now();Net.send({t:'linked',to:m.from});sendStatus(m.from);if(!was){renderMenu();refreshHUD()}});
Net.on('unlink',m=>{linked=false;renderMenu();refreshHUD()});
Net.on('session',m=>{teacherSeen=Date.now();endsAt=m.endsAt||0;ended=false});
Net.on('end',m=>{if(mode!=='menu')endSession()});
function sendStatus(to){Net.send({t:'status',to,diff:S.diff,streak:R?R.streak:0,wrongTotal:R?R.wrong:0,miss:R?R.wrongRow:0,
  correct:S.stats.correct,wrong:S.stats.wrong,stars:S.stats.stars,best:S.stats.best,letters:S.letters.size,coins:S.coins,cov:Pool.covered[S.diff].size})}
function endSession(){if(ended)return;ended=true;sendStatus();if(R)R.state='ended';$('#speak').classList.remove('on');$('#qcard').classList.remove('on');qShow(false);Rec.release();
  const s=S.stats;$('#su-txt').innerHTML=`<p>✅ <b>${s.correct}</b> &nbsp; 🔄 <b>${s.wrong}</b> &nbsp; ⭐ <b>${s.stars}</b> &nbsp; 🔥 <b>${s.best}</b></p><p>🔤 <b>${S.letters.size}/26</b> &nbsp; 🪙 <b>${S.coins}</b></p>`;
  openPanel('p-summary')}
$('#su-menu').onclick=()=>{endsAt=0;ended=false;toMenu()};

/* ----- 5 in a row: Difficulty 1 flows straight into Difficulty 2 (no message); Difficulty 2 completes the level ----- */
function doLevelUp(){
  R.pendingLU=0;R.state='celebrate';sendStatus();
  Snd.fanfare();for(let i=0;i<4;i++)setTimeout(()=>burst(rnd(200,760),rnd(120,300),26,['#ffc83d','#e8467c','#1fa3a3','#ff9f1c','#fff'],380,'sq'),i*140);
  if(S.diff===1){S.d1done=true;setTimeout(()=>{S.diff=2;beginRun()},1400)}
  else{S.levelDone=true;setTimeout(()=>{sendStatus();openPanel('p-level')},1400)}
}
$('#lv-again').onclick=()=>{S.diff=1;S.d1done=false;S.levelDone=false;Pool.covered={1:new Set(),2:new Set()};closePanel();beginRun()};
$('#lv-menu').onclick=()=>toMenu();

/* ----- caught by the teacher = repeat the stage (5 wrong in total, or 3 wrong in a row) ----- */
function gameOver(){if(!R||R.state==='over')return;R.state='over';Rec.release();openPanel('p-over')}
$('#ov-retry').onclick=()=>{S.diff=1;closePanel();beginRun()};
$('#ov-menu').onclick=()=>toMenu();

function beginRun(){closePanel();mode='play';newRun();hudOn(true);scroll=0;
  R.state='cd';countdown(3,()=>{if(R&&R.state==='cd')R.state='run'});Music.start()}
function toMenu(){closePanel();$('#qcard').classList.remove('on');$('#speak').classList.remove('on');qShow(false);$('#fb').classList.remove('on');Rec.release();mode='menu';R=null;hudOn(false);refreshHUD();renderMenu();openPanel('p-menu')}
$('#b-play').onclick=()=>{Snd.init();Say.init();Rec.prime();
  const cv=$('#in-code').value;if(cv&&cv.length!==4){$('#m-link').textContent='4️⃣';return}
  if(S.levelDone){S.diff=1;S.d1done=false;S.levelDone=false;Pool.covered={1:new Set(),2:new Set()}}
  S.stats={correct:0,wrong:0,stars:0,best:0,speakNo:0};beginRun()};
addEventListener('beforeunload',()=>{Net.send({t:'bye'})});
setInterval(()=>{if(linked&&!isLinked()){renderMenu()}},3000);

/* ================= Main loop ================= */
let last=performance.now(),idleT=0;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  {
    if(R&&mode==='play')updateRun(dt);
    updateFx(dt);shake=Math.max(0,shake-dt);
    ctx.setTransform(SC,0,0,SC,0,0);ctx.clearRect(0,0,W,H);
    ctx.save();if(shake>0)ctx.translate(rnd(-5,5)*shake*4,rnd(-5,5)*shake*4);
    if(R)drawRun();
    else drawMenuBG();
    drawFx(ctx);ctx.restore();
    if(mode==='menu')menuPreviews(T);wardrobeAnim(T);
  }
  requestAnimationFrame(frame);
}
function drawRun(){
  const th=R.th;drawBG(th,scroll,T);
  for(const d of R.decos)drawDeco(ctx,d,th);
  for(const o of R.objs){if(o.x>W+240||o.x<-340)continue;
    if(o.k==='hurdle')drawHurdle(ctx,o,th);else if(o.k==='book')drawBook(ctx,o,th,T);else if(o.k==='bar')drawBar(ctx,o,th);
    else if(o.k==='finish')drawFinish(ctx,o,th,T);else if(o.k==='coin'&&!o.taken)drawCoin(ctx,o,T)}
  if(R.tx>-90)drawKid(ctx,R.tx,GY,{ch:'girl',look:'teacher',pose:'run',t:R.tph,sc:1.3,mouth:chase()>.3?'open':null});
  const pose=R.state==='celebrate'?'cheer':P.stumble>0?'stumble':P.lift>1?'jump':P.crawling?'crawl':(R.state==='speakwait'||R.state==='ask')?'talk':R.state==='celebrate'?'cheer':'run';
  const moving=R.state==='run'||R.state==='cd'&&false;
  drawKid(ctx,P.x,GY-P.lift,kidOpts({pose,t:moving?T:T*.3}));
  if(P.lift>1){ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(P.x+4,GY+2,22*(1-P.lift/300),5,0,0,6.3);ctx.fill()}
}
function drawMenuBG(){if(!BG.far)buildBG(THEMES[0]);drawBG(BG.th,T*60,T)}
buildBG(THEMES[0]);fit();renderMenu();openPanel('p-menu');requestAnimationFrame(frame);
window.__khel={S,Pool,Rec,answerCard,openCard,get R(){return R},P,CONFIG,Net,get mode(){return mode},beginRun,finishSpeak,doLevelUp,isLinked,nextQuestion,makeQ,chase};


})();
